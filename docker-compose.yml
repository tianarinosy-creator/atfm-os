services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atfm
      POSTGRES_PASSWORD: atfm
      POSTGRES_DB: atfm_os
    ports:
      - "5432:5432"
    volumes:
      - atfm_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  atfm_postgres_data:
