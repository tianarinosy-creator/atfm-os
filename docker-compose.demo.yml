name: atfm-os-capital-demo

# Stack de démo persistante, autonome (Postgres + API + Web + Caddy en TLS
# automatique). Distinct de docker-compose.yml (Postgres/Redis de dev local) :
# celui-ci construit et sert réellement l'application, avec de vrais secrets
# (voir .env.demo.example) — jamais les valeurs de développement par défaut.
#
# Démarrage : cp .env.demo.example .env.demo, renseigner les secrets, puis
#   docker compose -f docker-compose.demo.yml --env-file .env.demo up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atfm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: atfm_os
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atfm -d atfm_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://atfm:${POSTGRES_PASSWORD}@db:5432/atfm_os?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      ODOO_CREDENTIALS_KEY: ${ODOO_CREDENTIALS_KEY}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3001/api
    depends_on:
      - api

  # Reverse proxy public — seul service exposé sur 80/443. Termine le TLS pour
  # ${DOMAIN} via Let's Encrypt (ACME automatique), et route tout vers `web`.
  # L'API n'est JAMAIS exposée publiquement : le navigateur ne lui parle
  # jamais directement (voir apps/web/lib/api.ts — appels serveur uniquement).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
